[package]
name = "musick-aac-decoder"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "musick_aac_decoder"
crate-type = ["cdylib"]

[dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "isomp4"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
